  <text x="110" y="58" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="700" fill="#2C2A29" letter-spacing="1.5">Aquarela</text>
  <text x="112" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#6B6562" letter-spacing="4">FOTO &amp; VÍDEO</text>

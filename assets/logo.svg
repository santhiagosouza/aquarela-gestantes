      <stop offset="0%" stop-color="#E8C5B8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C47A5A" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8FA89B" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Blob de aquarela suave de fundo -->
